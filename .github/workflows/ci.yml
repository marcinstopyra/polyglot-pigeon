name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Lowest version the project supports, so CI fails on anything that
          # only works on a newer interpreter.
          python-version: "3.12"

      - name: Install Poetry
        # poetry.lock is lock-version 2.1, which needs Poetry >= 2.1 to read.
        run: pipx install 'poetry~=2.3'

      - name: Check poetry.lock is in sync with pyproject.toml
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --with dev

      # ruff check, ruff format --check, and lint-imports. The import contracts
      # are the only thing enforcing the shared/content/services dependency
      # graph — there is no packaging barrier behind them under one
      # distribution, so a broken contract must fail the build.
      - name: Lint
        run: make lint

      - name: Unit tests
        # Unit suite only (make test) — in-memory SQLite, no services needed.
        # Everything requiring real MySQL carries the "mysql" marker and runs
        # in the integration-test job instead.
        run: make test

  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install 'poetry~=2.3'

      - name: Install dependencies
        run: poetry install --with dev

      # A GitHub Actions `services:` container can't take mysqld startup
      # flags (no `command:` override), so this runs MySQL directly via
      # `docker run` instead — the only way to keep the charset flags below
      # identical to docker-compose.yml's `db` service. If one changes, the
      # other must too.
      - name: Start MySQL 8 (matches docker-compose.yml's db service)
        run: |
          docker run -d --name mysql \
            -p 3306:3306 \
            -e MYSQL_DATABASE=polyglot_test \
            -e MYSQL_USER=polyglot \
            -e MYSQL_PASSWORD=polyglot \
            -e MYSQL_ROOT_PASSWORD=polyglot \
            mysql:8 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci

      - name: Wait for MySQL to be ready
        run: |
          for i in $(seq 1 30); do
            docker exec mysql mysqladmin ping -h localhost -uroot -ppolyglot --silent && exit 0
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      - name: Migrate
        env:
          DB_NAME: polyglot_test
          DB_PASSWORD: polyglot
        run: poetry run alembic upgrade head

      - name: Integration tests
        env:
          DB_NAME: polyglot_test
          DB_PASSWORD: polyglot
        run: poetry run pytest tests/integration_tests/ -m mysql

  build-and-push:
    needs: [lint-and-test, integration-test]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # short commit SHA on every push  →  e.g. sha-a1b2c3d
            type=sha
            # branch name  →  e.g. main, feature-xyz
            type=ref,event=branch
            # semver tags from git tag  →  e.g. 0.1.0, 0.1, 0
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # :latest only on main
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha        # reuse layer cache from previous runs
          cache-to: type=gha,mode=max
