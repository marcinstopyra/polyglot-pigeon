[project]
name = "polyglot-pigeon"
version = "0.1.0"
description = ""
authors = [
    {name = "marcinstopyra",email = "m.stopyra97@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
controller = [
    "anthropic (>=0.84.0,<0.85.0)",
    "openai (>=1.0.0,<2.0.0)",
]

[tool.poetry]
packages = [{include = "polyglot_pigeon", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.10,<0.15.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "import-linter (>=2.1,<3.0)"
]

[tool.ruff]
include = [
    "src/**/*.py",
    "tests/**/*.py",
]
exclude = [
    "*.md",
]
target-version = "py312"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "F",               # pyflakes
    "E4", "E7", "E9",  # pycodestyle
    "I001",            # isort
]

fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "src",
]
testpaths = [
    "tests/unit_tests/"
]
log_file_level = "DEBUG"

[tool.poetry.dependencies]
pydantic = "^2.12.5"
pyyaml = "^6.0.3"
schedule = "^1.2.0"
markdown = "^3.0"
pytz = "^2025.2"
jinja2 = "^3.0"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
pymysql = "^1.1.1"
cryptography = "^43.0.3"

[tool.importlinter]
root_package = "polyglot_pigeon"

[[tool.importlinter.contracts]]
name = "shared must not depend on content or services"
type = "forbidden"
source_modules = ["polyglot_pigeon.shared"]
forbidden_modules = ["polyglot_pigeon.content", "polyglot_pigeon.services"]

[[tool.importlinter.contracts]]
name = "content may only depend on shared"
type = "forbidden"
source_modules = ["polyglot_pigeon.content"]
forbidden_modules = ["polyglot_pigeon.services"]

[[tool.importlinter.contracts]]
name = "only the controller service may depend on content"
type = "forbidden"
source_modules = [
    "polyglot_pigeon.services.ingest",
    "polyglot_pigeon.services.courier",
    "polyglot_pigeon.services.bot",
]
forbidden_modules = ["polyglot_pigeon.content"]

[[tool.importlinter.contracts]]
name = "services must not depend on each other"
type = "independence"
modules = [
    "polyglot_pigeon.services.ingest",
    "polyglot_pigeon.services.controller",
    "polyglot_pigeon.services.courier",
    "polyglot_pigeon.services.bot",
]
