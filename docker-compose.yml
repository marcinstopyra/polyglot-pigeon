services:
  polyglot-pigeon:
    build: .
    restart: unless-stopped
    env_file: .env          # credentials never baked into image
    environment:
      DB_HOST: db
      LOG_FILE: /app/logs/polyglot_pigeon.log
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs    # persist logs on host
      # Optional: mount a prompt overrides file (path set via PIPELINE_PROMPTS_PATH).
      # - ./prompts.yaml:/app/prompts.yaml:ro

  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-polyglot}
      MYSQL_USER: ${DB_USER:-polyglot}
      MYSQL_PASSWORD: ${DB_PASSWORD:-polyglot}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-polyglot}
    # Mirrored in .github/workflows/ci.yml's integration-test job (a plain
    # `docker run`, not a services: container, precisely so it can carry
    # these same flags) — keep the two in step or the charset tests pass in
    # one place and fail in the other.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD:-polyglot}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
