services:
  polyglot-pigeon:
    build: .
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro   # credentials never baked into image
      - ./logs:/app/logs                    # persist logs on host
      # Optional: mount a prompt overrides file (path set via pipeline.prompts_path in config.yaml).
      # - ./prompts.yaml:/app/prompts.yaml:ro

  # Interactive Telegram bot prototype — same image, different entrypoint.
  # Needs a `telegram:` section in config.yaml (token + whitelisted_users).
  polyglot-pigeon-bot:
    build: .
    restart: unless-stopped
    command: ["python", "src/polyglot_pigeon/bot/mock_bot.py", "-c", "/app/config.yaml"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
